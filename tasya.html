<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopyalama Sayfası</title>
<style>
body {
  background: #202124;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 50px 15px;
}
button {
  padding: 15px 35px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  background: #8ab4f8;
}
</style>
</head>
<body>

<h2>Kopyalama</h2>
<p id="durum">Kopyalamak için butona bas.</p>

<button onclick="kopyala()">Kopyala</button>

<script>
async function kopyala() {
  try {
    await navigator.clipboard.writeText("mangoshadamjjaxnabzj67");
    document.getElementById("durum").innerText = "Kopyaladın!";
  } catch (e) {
    document.getElementById("durum").innerText = "Kopyalama başarısız!";
  }
}
</script>

</body>
</html>
