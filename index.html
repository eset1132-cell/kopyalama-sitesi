
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopyalama Sitesi</title>
</head>
<body>

<span id="yazi">Merhaba Dünya!</span>
<button onclick="kopyala()">Kopyala</button>

<script>
function kopyala() {
  navigator.clipboard.writeText(
    document.getElementById("yazi").innerText
  );
}
</script>

</body>
</html>
