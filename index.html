<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopyalama Sitesi</title>
</head>
<body>

<span id="yazi">mangoshadamjjaxnabzj67</span>
<button onclick="kopyala()">Kopyala</button>
<span id="durum"></span>

<script>
async function kopyala() {
  const yazi = document.getElementById("yazi").innerText;
  const durum = document.getElementById("durum");

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(yazi);
    } else {
      throw new Error("Clipboard kullanılamıyor");
    }
    durum.innerText = "Kopyalandı!";
  } catch (e) {
    const alan = document.createElement("textarea");
    alan.value = yazi;
    document.body.appendChild(alan);
    alan.select();

    const basarili = document.execCommand("copy");
    alan.remove();

    durum.innerText = basarili
      ? "Kopyalandı!"
      : "Kopyalama başarısız!";
  }
}
</script>

</body>
</html>
