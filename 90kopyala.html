
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>90 Saniye Bekleme</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px 15px;
  background: #202124;
  color: white;
}

#sure {
  font-size: 55px;
  font-weight: bold;
  margin: 25px;
}

button {
  padding: 14px 25px;
  border: none;
  border-radius: 9px;
  font-size: 17px;
}

button:disabled {
  background: #777;
  color: #ccc;
}

button:not(:disabled) {
  background: #8ab4f8;
  color: #202124;
}
</style>
</head>

<body>

<h2>Bekleme Süresi</h2>

<div id="sure">90</div>

<p id="durum">Lütfen 90 saniye bekle.</p>

<p id="yazi">Merhaba Dünya!</p>

<button id="kopyala" disabled onclick="kopyala()">
Kopyala
</button>

<script>
let kalan = 90;

const sure = document.getElementById("sure");
const durum = document.getElementById("durum");
const buton = document.getElementById("kopyala");

const zamanlayici = setInterval(() => {
  kalan--;
  sure.innerText = kalan;

  if (kalan <= 0) {
    clearInterval(zamanlayici);
    sure.innerText = "0";
    durum.innerText = "Süre tamamlandı! Kopyalayabilirsin.";
    buton.disabled = false;
  }
}, 1000);

async function kopyala() {
  const yazi = document.getElementById("yazi").innerText;

  try {
    await navigator.clipboard.writeText(yazi);
    durum.innerText = "Yazı kopyalandı!";
  } catch (e) {
    const alan = document.createElement("textarea");
    alan.value = yazi;
    document.body.appendChild(alan);
    alan.select();

    const basarili = document.execCommand("copy");
    alan.remove();

    durum.innerText = basarili
      ? "Yazı kopyalandı!"
      : "Kopyalama başarısız!";
  }
}
</script>

</body>
</html>
